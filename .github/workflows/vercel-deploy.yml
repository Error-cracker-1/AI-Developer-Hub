name: Deploy Vercel

on:
  pull_request:
    branches:
      - deploy-vercel
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - deploy-vercel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy-vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Never expose the Vercel token to pull requests originating from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Deploy Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_oNbtushdXRxAAyTiw0na2Zpy
      VERCEL_PROJECT_ID: prj_ef4HfCK1KCK2DCnh2k05qrfGrtgV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate deployment target and credentials
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ github.event.pull_request.base.ref }}" != "deploy-vercel" ]; then
            echo "Refusing to deploy a pull request targeting the wrong branch."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "deploy-vercel" ]; then
            echo "Refusing to deploy from the wrong branch."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "deploy-vercel" ]; then
            echo "Manual deployments are only allowed from deploy-vercel."
            exit 1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing repository Actions secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project settings
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            URL="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $URL"
