name: Deploy Vercel

on:
  pull_request:
    branches:
      - deploy-vercel
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: vercel-preview-deploy-vercel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Do not expose the Vercel token to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Preview Deploy — AI Developer Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_oNbtushdXRxAAyTiw0na2Zpy
      VERCEL_PROJECT_ID: prj_ef4HfCK1KCK2DCnh2k05qrfGrtgV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate deployment target and credentials
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "deploy-vercel" ]; then
            echo "Refusing to deploy a pull request targeting the wrong branch."
            exit 1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing repository Actions secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployment URL: $URL"
          {
            echo "## AI Developer Hub preview deployment"
            echo ""
            echo "Preview URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
