name: Sync feature flags lockfile

on:
  push:
    branches:
      - ai-developer-hub/vercel-flags-sdk

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate a consistent npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync feature flags lockfile"
            git push
          fi
      - name: Install from lockfile
        run: npm ci
      - name: Build AI Developer Hub
        run: npm run build
