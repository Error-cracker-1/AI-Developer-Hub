name: Release PR Dry Run

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - deploy-vercel
      - rubiks-cube-solver

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-pr-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'release:test') &&
      (github.event.pull_request.base.ref == 'deploy-vercel' ||
       github.event.pull_request.base.ref == 'rubiks-cube-solver')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the target production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Calculate the next version without creating a tag
        id: plan
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == "deploy-vercel" ]]; then
            APP="AI Developer Hub"
            PREFIX="ai-hub-v"
          elif [[ "$BASE_BRANCH" == "rubiks-cube-solver" ]]; then
            APP="TwistLab"
            PREFIX="twistlab-v"
          else
            echo "::error::Unsupported production branch: $BASE_BRANCH"
            exit 1
          fi
          git fetch --tags --force origin
          LATEST="$(git tag -l "${PREFIX}*" --sort=-version:refname | head -n 1)"
          if [[ -z "$LATEST" ]]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            VERSION="${LATEST#"$PREFIX"}"
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest tag '$LATEST' is not valid semantic versioning."
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
          fi
          PATCH=$((PATCH + 1))
          NEXT="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"
          {
            echo "app=$APP"
            echo "latest_tag=${LATEST:-none}"
            echo "next_tag=$NEXT"
            echo "base_branch=$BASE_BRANCH"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release automation dry run"
            echo ""
            echo "- Application: **$APP**"
            echo "- PR: **#$PR_NUMBER — $PR_TITLE**"
            echo "- Target branch: **$BASE_BRANCH**"
            echo "- Latest existing tag: **${LATEST:-none}**"
            echo "- Proposed next patch tag: **$NEXT**"
            echo "- Result: **PASS — trigger and app routing matched**"
            echo ""
            echo "No Git tag was created and no GitHub Release was published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm dry-run result
        run: |
          echo "Dry run passed for ${{ steps.plan.outputs.app }}."
          echo "Would propose tag: ${{ steps.plan.outputs.next_tag }}"
          echo "No repository refs or releases were modified."
